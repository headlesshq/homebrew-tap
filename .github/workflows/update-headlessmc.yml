name: Update headlessmc

on:
  # sent by the release job of headlesshq/headlessmc
  repository_dispatch:
    types: [ headlessmc-release ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of headlesshq/headlessmc (defaults to the latest release)
        required: false
  # fallback in case a dispatch got lost
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: update-headlessmc
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@main

      - name: Render formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          cd "$(brew --repository "$GITHUB_REPOSITORY")"
          bash .github/scripts/update-headlessmc.sh "$TAG"
          if git diff --quiet -- Formula/headlessmc.rb; then
            echo "headlessmc is up to date"
            echo "CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Audit, install and test
        if: env.CHANGED == 'true'
        run: |
          brew style "$GITHUB_REPOSITORY/headlessmc"
          brew audit --strict --online --formula "$GITHUB_REPOSITORY/headlessmc"
          brew install "$GITHUB_REPOSITORY/headlessmc"
          brew test "$GITHUB_REPOSITORY/headlessmc"

      - name: Commit and push
        if: env.CHANGED == 'true'
        run: |
          cd "$(brew --repository "$GITHUB_REPOSITORY")"
          version="$(grep -m1 -oP '^\s*version "\K[^"]+' Formula/headlessmc.rb)"
          git add Formula/headlessmc.rb
          git commit -m "headlessmc $version"
          git push origin HEAD:main
