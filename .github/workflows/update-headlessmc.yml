name: Update headlessmc

# Renders Formula/headlessmc.rb for a release, installs and tests it on every
# platform the formula supports and only then pushes it to main.

on:
  # sent by the release job of headlesshq/headlessmc
  repository_dispatch:
    types: [ headlessmc-release ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of headlesshq/headlessmc (defaults to the latest release)
        required: false
      publish:
        description: Push the tested formula to main (disable to only test a release)
        type: boolean
        default: true
  # fallback in case a dispatch got lost
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: update-headlessmc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.render.outputs.changed }}
      version: ${{ steps.render.outputs.version }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render formula
        id: render
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          cd "$(brew --repository "$GITHUB_REPOSITORY")"
          bash .github/scripts/update-headlessmc.sh "$TAG"
          version="$(grep -m1 -oP '^\s*version "\K[^"]+' Formula/headlessmc.rb)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- Formula/headlessmc.rb; then
            echo "headlessmc $version is up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cp Formula/headlessmc.rb "$GITHUB_WORKSPACE/headlessmc.rb"
          fi

      - name: Style and audit
        if: steps.render.outputs.changed == 'true'
        run: |
          brew style "$GITHUB_REPOSITORY/headlessmc"
          brew audit --strict --online --formula "$GITHUB_REPOSITORY/headlessmc"

      - name: Upload formula
        if: steps.render.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: headlessmc-formula
          path: headlessmc.rb

  test:
    needs: render
    if: needs.render.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        # linux-x64, linux-arm64, macos-x64, macos-arm64
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-26 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download formula
        uses: actions/download-artifact@v4
        with:
          name: headlessmc-formula

      - name: Install and test
        run: |
          cp headlessmc.rb "$(brew --repository "$GITHUB_REPOSITORY")/Formula/headlessmc.rb"
          brew install --formula "$GITHUB_REPOSITORY/headlessmc"
          brew test "$GITHUB_REPOSITORY/headlessmc"
          headlessmc --version

  publish:
    needs: [ render, test ]
    # inputs.publish is only set for manual runs
    if: inputs.publish != false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download formula
        uses: actions/download-artifact@v4
        with:
          name: headlessmc-formula
          path: ${{ runner.temp }}

      - name: Commit and push
        env:
          VERSION: ${{ needs.render.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/headlessmc.rb" Formula/headlessmc.rb
          git add Formula/headlessmc.rb
          git commit -m "headlessmc $VERSION"
          # main might have moved while the tests ran
          git pull --rebase origin main
          git push origin HEAD:main
